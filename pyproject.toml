[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-capacity-index"
version = "1.0.0"
description = "Inference Capacity Index: reproducible prefill and decode capacity from analytical frontiers"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agent-index = "agent_index.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
