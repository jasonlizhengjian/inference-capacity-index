[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-capacity-index"
version = "0.1.0"
description = "Reproducible long-context decode capacity index from frozen analytical frontiers"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agent-index = "agent_index.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
